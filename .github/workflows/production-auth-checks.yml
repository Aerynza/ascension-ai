name: Native AI security checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Security-boundary tests do not load GGUF models; avoid the heavyweight llama wheel.
          pip install 'fastapi>=0.115,<1' 'pydantic>=2.8,<3' 'keyring>=25' 'httpx>=0.27' 'pytest>=8' 'pytest-asyncio>=0.24' 'rfc8785==0.1.4' 'psycopg[binary]==3.3.6'
      - name: Compile service modules
        run: python -m compileall -q src scripts
      - name: Verify replacement contracts without loading a model
        run: python scripts/replacement_contract_eval.py
      - name: Build and validate next-GPU 640 capability curriculum on CPU
        run: |
          python -m scripts.build_v251_640_truth_curriculum
          python -m scripts.train_qwen_ascension_lora --curriculum evals/training/aerynza_v251_640_balanced.jsonl --eval-curriculum evals/training/aerynza_v251_independent_heldout.jsonl --validate-only
          python -m unittest -v scripts.test_v251_training_preflight
      - name: Run security regression suite
        run: python -m pytest -q tests/test_production_auth.py tests/test_thesis_shell_isolation.py tests/test_request_integrity.py tests/test_envelope_signature.py tests/test_replay_guard.py tests/test_postgres_replay_store.py tests/test_http_envelope.py tests/test_node_interop_vector.py tests/test_canonicalization_contract.py tests/test_native_admission_contract.py tests/test_release_gate.py

