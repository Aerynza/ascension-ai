name: Aerynza v253 self-reliance training preflight

on:
  pull_request:
    paths:
      - 'evals/training/aerynza_v253_*'
      - 'evals/benchmarks/aerynza_v253_*'
      - 'training/v253/**'
      - 'scripts/*v253*'
      - 'tests/test_v253_training_packages.py'
      - '.github/workflows/v253-training-preflight.yml'
      - 'public/capability_report.json'
      - 'evals/capability_status.json'
  push:
    branches:
      - 'codex/aerynza-v253-self-reliance-packs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v253-curriculum-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prior v251 and v252 integrity gates
        run: |
          python3 scripts/validate_v251_packages.py
          python3 scripts/validate_v252_packages.py
      - name: Validate targeted v253 train, heldout, benchmark and full 640-ID inventory
        run: python3 scripts/validate_v253_packages.py
      - name: Run negative controls for prompt leakage and unsupported capability claims
        run: python3 -m unittest discover -s tests -p 'test_v253_training_packages.py' -v
      - name: Build deterministic GPU curriculum mix without benchmark leakage
        run: python3 scripts/build_v253_gpu_mix.py
      - name: Check existing Qwen LoRA trainer schema without GPU or downloading model
        run: |
          python3 scripts/train_qwen_ascension_lora.py \
            --curriculum evals/training/aerynza_v253_gpu_mix_train.jsonl \
            --eval-curriculum evals/training/aerynza_v253_independent_heldout.jsonl \
            --output-dir checkpoints/v253_validate_only \
            --max-length 1024 --learning-rate 2e-6 --epochs 1.0 --validate-only
      - name: Regenerate 640-ID evidence queue (never treated as execution proof)
        run: python3 scripts/build_v251_capability_validation_queue.py
      - name: Separate 640 historical capability claims from actual execution evidence
        run: |
          python3 scripts/build_v253_640_execution_map.py
          python3 -m unittest discover -s tests -p 'test_v253_640_execution_map.py' -v
      - name: Shell syntax only; do not launch GPU
        run: bash -n scripts/launch_v253_self_reliance.sh
