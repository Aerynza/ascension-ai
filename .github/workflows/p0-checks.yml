name: P0 HTTP checks

on:
  push:
  pull_request:

jobs:
  p0-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115,<1" "pydantic>=2.8,<3" pytest httpx
      - name: Run P0 HTTP tests
        run: python -m pytest tests/test_p0_hardening.py tests/test_model_deploy_preflight.py tests/test_release_readiness.py -q
      - name: Compile service modules
        run: python -m compileall -q src scripts
